# Include inside nginx's http context (e.g. sites-enabled).
# Replace domains, certificate paths and /srv paths before enabling.
limit_req_zone $binary_remote_addr zone=root_contact:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=root_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ROOT_TLS:10m;

    root /srv/root-squad/root-squad-vue/dist;
    index index.html;
    client_max_body_size 32k;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/contact/ {
        limit_req zone=root_contact burst=5 nodelay;
        include /etc/nginx/snippets/root-squad-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/root-squad-proxy.conf;
    }

    location = /admin/login/ {
        limit_req zone=root_login burst=5 nodelay;
        include /etc/nginx/snippets/root-squad-proxy.conf;
    }

    location /admin/ {
        include /etc/nginx/snippets/root-squad-proxy.conf;
    }

    location /static/ {
        alias /srv/root-squad/root-squad-vue/backend/staticfiles/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location ~ /\. {
        deny all;
    }
}
